[project]
name = "phase-0-baseline"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "deepusjoseph", email = "deepu.joseph@toobler.com" }
]
requires-python = ">=3.14"
dependencies = []

[project.scripts]
phase-0-baseline = "phase_0_baseline:main"

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pyright>=1.1.411",
    "pytest>=9.1.1",
    "ruff>=0.16.5",
]
[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.pyright]
include = ["src"]
exclude = ["**/__pycache__"]
typeCheckingMode = "basic"